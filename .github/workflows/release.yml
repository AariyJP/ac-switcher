on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  set_version:
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          VERSION="$(git log -1 --format=%s | tr -d '[:space:]')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  create_draft_release:
    needs: [set_version]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Switcher ${{ needs.set_version.outputs.version }}
          body: |
            AI Switcher ${{ needs.set_version.outputs.version }} ${{ github.sha }}
          draft: true

  publish:
    needs: [set_version, create_draft_release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle_dir: dmg
            file_pattern: "*.dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_dir: nsis
            file_pattern: "*-setup.exe"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}
          cache-on-failure: true

      - run: pnpm i --frozen-lockfile --prefer-offline

      - run: pnpm version:bump "${{ needs.set_version.outputs.version }}"

      - uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - id: rename_installer
        shell: bash
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle_dir }}"
          source="$(find "$dir" -maxdepth 1 -type f -name '${{ matrix.file_pattern }}' -print -quit)"
          target="${source/_${{ needs.set_version.outputs.version }}/}"
          mv "$source" "$target"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - id: build_msix
        if: matrix.bundle_dir == 'nsis'
        shell: bash
        run: |
          stage="$RUNNER_TEMP/msix"
          mkdir -p "$stage"
          cp scripts/msix/AppxManifest.xml scripts/msix/*.png "$stage/"
          cp "src-tauri/target/${{ matrix.target }}/release/ai-switcher.exe" "$stage/"
          sed -i 's/Version="0.0.0.0"/Version="${{ needs.set_version.outputs.version }}.0"/' "$stage/AppxManifest.xml"
          makeappx="$(find '/c/Program Files (x86)/Windows Kits/10/bin' -type f -iname MakeAppx.exe -path '*/x64/*' | sort -V | tail -n 1)"
          [ -n "$makeappx" ]
          file="AI Switcher_x64.msix"
          MSYS_NO_PATHCONV=1 "$makeappx" pack /d "$(cygpath -w "$stage")" /p "$file" /o
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: true
          files: |
            ${{ steps.rename_installer.outputs.file }}
            ${{ steps.build_msix.outputs.file }}

  finalize_release:
    needs: [set_version, publish]
    runs-on: ubuntu-slim
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set_version.outputs.version }}
          draft: false
